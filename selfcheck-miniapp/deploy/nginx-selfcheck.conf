# nginx vhost for the SelfCheck Mini App.
# 1) Replace __DOMAIN__ with your subdomain (e.g. selfcheck.example.com).
# 2) Put this file at /etc/nginx/sites-available/selfcheck.conf
# 3) ln -s /etc/nginx/sites-available/selfcheck.conf /etc/nginx/sites-enabled/
# 4) nginx -t && systemctl reload nginx
# 5) certbot --nginx -d __DOMAIN__   (adds the 443 server + TLS automatically)
#
# This vhost matches ONLY your subdomain, so the existing project's vhosts
# are unaffected.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Allow Telegram's webhook/sizeable initData and normal requests.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
